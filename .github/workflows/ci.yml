name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: build
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/update ./cmd/update
          CGO_ENABLED=0 go build -trimpath -o bin/updateserver ./server

  dist:
    name: cross-compile
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath \
            -ldflags "-s -w -X update/internal/versioninfo.Version=${VERSION}" \
            -o update-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/update
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath \
            -o updateserver-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./server
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            update-*
            updateserver-*
          if-no-files-found: error
